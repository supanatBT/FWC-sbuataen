<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card">
        <div class="card-header"></div>
        <img src="profile.jpg" alt="Profile Picture" class="profile-pic">

        <!-- ตารางล่องหนตามโจทย์ -->
        <table class="info-table">
            <tr>
                <td class="login-name">Supanat</td>
            </tr>
            <tr>
                <td class="description">Data Engineer</td>
            </tr>
            <tr>
                <td class="social-icons">
                    <a href="https://github.com/supanatBT"><img src="github.png" alt="GitHub"></a>
                    <a href="https://www.facebook.com/nuttyzxopzaa.buataaeng/about/?fb_profile_edit_entry_point=%7B%22click_point%22%3A%22edit_profile_button%22%2C%22feature%22%3A%22profile_header%22%7D&id=100018217175016&sk=about"><img src="facebook.png" alt="LinkedIn"></a>
                    <a href="https://www.instagram.com/superzxd/?hl=th"><img src="instagram.png" alt="Twitter"></a>
                </td>
            </tr>
        </table>

        <button class="contact-btn">Contact</button>
    </div>

</body>
</html>
