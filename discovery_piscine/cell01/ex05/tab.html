<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab Exercise</title>
    <style>
        table {
            width: 100%;
            height: 100vh;
            border-collapse: collapse;
        }
        td {
            width: 50%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }
        .box1 {
            background-color: #99b9ff;
            color: #333;
        }
        .box2 {
            background-color: #f8ff99;
            color: #333;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="box1">Supanat</td>
            <td class="box2">Buataeng</td>
        </tr>
    </table>
</body>
</html>
