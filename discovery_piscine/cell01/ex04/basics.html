<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
        }
        .header-title {
            color: white;
            text-align: center;
            font-size: 3em;
        }
        .shops-container {
            display: flex;
            justify-content: center;
            gap: 50px;
            align-items: center;
            margin-top: 30px;
        }
        .shop-item {
            text-align: center;
        }
        .shop-item img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            display: block;
            margin-bottom: 10px;
        }
        .footer {
            text-align: right;
            font-style: italic;
            font-family: monospace;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <h1 class="header-title">Shopee & Lazada!</h1>
    
    <div class="shops-container">
        <div class="shop-item">
            <img src="shop1.png" alt="Shop 1">
            <a href="https://shopee.co.th" target="_blank">Shopee Website</a>
        </div>
        <div class="shop-item">
            <img src="shop2.png" alt="Shop 2">
            <a href="https://www.lazada.co.th" target="_blank">Lazada Website</a>
        </div>
    </div>

    <hr>

    <div class="footer">
        &copy; sbuataen 2026
    </div>
</body>
</html>
