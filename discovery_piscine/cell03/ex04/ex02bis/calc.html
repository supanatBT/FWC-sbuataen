<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calc (jQuery)</title>
    <link rel="stylesheet" href="calc.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="calculator">
        <input type="text" id="left" placeholder="Left">
        <select id="operator">
            <option value="+">+</option><option value="-">-</option><option value="*">*</option><option value="/">/</option><option value="%">%</option>
        </select>
        <input type="text" id="right" placeholder="Right">
        <button>Try me!</button>
    </div>
    <script src="calc.js"></script>
</body>
</html>
